<style>
  /* ---------- Colors: monochrome on ivory ---------- */
  :root {
    --bg: #FFFFF0;          /* ivory backdrop */
    --surface: #FFFFFA;     /* cards sit a touch lighter */
    --ink: #111111;         /* text */
    --muted: #595959;       /* secondary text */
    --line: #D6D6CA;        /* borders and dividers */
    --accent: #111111;      /* buttons, highlights */
    --accent-ink: #FFFFF0;  /* text on top of buttons */
    --accent-soft: #EBEBDD; /* chips */
    --accent-text: #111111; /* accent used for text */
    --pop: #111111;         /* small highlight color */
    --display: "Space Grotesk", "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- Colorful palettes for the three views (cover stays monochrome) ---------- */
  :root[data-mode="recruiters"] {
    color-scheme: light; --bg: #F2F4F8; --surface: #FFFFFF; --ink: #101828; --muted: #566074; --line: #D5DAE3;
    --accent: #1F4FE0; --accent-ink: #FFFFFF; --accent-soft: #E3EAFF; --accent-text: #1F4FE0; --pop: #1F4FE0;
  }
  :root[data-mode="clients"] {
    color-scheme: light; --bg: #EDF6F2; --surface: #FFFFFF; --ink: #0F2A24; --muted: #4F6A63; --line: #CFE0DA;
    --accent: #0B7A66; --accent-ink: #FFFFFF; --accent-soft: #D3EDE4; --accent-text: #0B7A66; --pop: #0B7A66;
  }
  :root[data-mode="personal"] {
    color-scheme: light; --bg: #F8F1F8; --surface: #FFFFFF; --ink: #2A1230; --muted: #6D5675; --line: #E6D3E8;
    --accent: #B4237A; --accent-ink: #FFFFFF; --accent-soft: #F6D9EA; --accent-text: #B4237A; --pop: #B4237A;
  }

  /* ---------- Dark-mode versions of the three views (used when the device is set to dark mode) ---------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"])[data-mode="recruiters"] {
      color-scheme: dark;
      --bg: #0E1424; --surface: #161E33; --ink: #E8ECF5; --muted: #9AA5BD; --line: #26304A;
      --accent: #7C9BFF; --accent-ink: #0E1424; --accent-soft: #1E2A52; --accent-text: #7C9BFF; --pop: #7C9BFF;
    }
    :root:not([data-theme="light"])[data-mode="clients"] {
      color-scheme: dark;
      --bg: #0C1B18; --surface: #12261F; --ink: #E6F4EF; --muted: #9BBBB1; --line: #21433A;
      --accent: #4FD1B5; --accent-ink: #0C1B18; --accent-soft: #17403A; --accent-text: #4FD1B5; --pop: #4FD1B5;
    }
    :root:not([data-theme="light"])[data-mode="personal"] {
      color-scheme: dark;
      --bg: #1A1020; --surface: #241730; --ink: #F5E9F7; --muted: #BBA3C3; --line: #41284F;
      --accent: #FF7AC3; --accent-ink: #1A1020; --accent-soft: #4A1F3C; --accent-text: #FF7AC3; --pop: #FF7AC3;
    }
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 18px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 22px 64px; }

  /* ---------- Hero ---------- */
  .hero { padding: 28px 0 8px; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 26px;
    margin-bottom: 22px; overflow: hidden;
    transition: background-color .35s ease, color .35s ease;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(4rem, 24vw, 7.5rem); line-height: .95; letter-spacing: -0.03em;
    margin: 0 0 18px;
  }
  .where { color: var(--muted); font-size: .95rem; margin: -6px 0 18px; }
  .where:empty { display: none; }
  .tagline { font-size: 1.3rem; color: var(--muted); max-width: 36ch; margin: 0 0 26px; min-height: 5.2em; }
  @media (min-width: 560px) { .tagline { min-height: 3.9em; } }

  /* ---------- View switch ---------- */
  .switch {
    display: inline-flex; flex-wrap: wrap; padding: 4px; gap: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 26px;
  }
  .switch button {
    font: inherit; font-weight: 600; font-size: .95rem;
    border: 0; background: transparent; color: var(--muted);
    padding: 10px 16px; border-radius: 999px; cursor: pointer; min-height: 44px;
    transition: background-color .25s ease, color .25s ease;
  }
  .switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* ---------- Links ---------- */
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 8px; }
  .links a {
    text-decoration: none; font-weight: 600; font-size: .98rem;
    padding: 11px 18px; border-radius: 12px; min-height: 44px;
    border: 1px solid var(--line); background: var(--surface);
    transition: border-color .2s ease;
  }
  .links a:hover { border-color: var(--accent); }
  .links a.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* ---------- Sections ---------- */
  section { margin-top: 56px; }
  h2 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; letter-spacing: -0.01em; line-height: 1.2; margin: 0 0 18px; }
  #page h2::before { content: ""; display: block; width: 44px; height: 6px; border-radius: 3px; background: var(--pop); margin-bottom: 14px; }
  #page .hl { color: var(--accent-text); }
  p { margin: 0 0 1em; max-width: 62ch; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
  .chips li {
    background: var(--accent-soft); color: var(--ink);
    padding: 6px 14px; border-radius: 999px; font-size: 1rem; font-weight: 500;
    transition: background-color .35s ease;
  }

  .rows { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .rows li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 6px 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .rows .when { color: var(--accent-text); font-weight: 600; font-size: .95rem; transition: color .35s ease; }
  .rows .what strong { display: block; font-weight: 600; font-size: 1.15rem; }
  .rows .what span { color: var(--muted); }
  @media (max-width: 520px) { .rows li { grid-template-columns: 1fr; } }

  .cards { display: grid; gap: 14px; }
  .cards a, .cards div.item {
    display: block; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 22px; transition: border-color .2s ease;
  }
  .cards a:hover { border-color: var(--accent); }
  .cards h3 { font-family: var(--display); font-size: 1.3rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .cards p { margin: 0; color: var(--muted); }

  .contact {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 22px; padding: 30px 26px;
    transition: background-color .35s ease, color .35s ease;
  }
  .contact h2 { margin-bottom: 8px; }
  .contact p { margin-bottom: 18px; }
  .contact a {
    display: inline-block; text-decoration: none; font-weight: 600;
    background: var(--accent-ink); color: var(--accent);
    padding: 12px 20px; border-radius: 12px; min-height: 44px;
  }

  /* ---------- Cover page ---------- */
  #cover {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: left; padding: 40px 22px;
  }
  #cover[hidden], #page[hidden] { display: none; }
  .cover-inner { width: 100%; max-width: 520px; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .cover-photo {
    width: 132px; height: 132px; border-radius: 50%; margin: 0 0 26px; overflow: hidden;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 44px;
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent);
  }
  .cover-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #cover h1 { margin-bottom: 14px; }
  .cover-tag { color: var(--muted); font-size: 1.3rem; margin: 0 0 30px; max-width: 30ch; }
  .tabs { display: grid; gap: 12px; text-align: left; margin-bottom: 28px; }
  .tab {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
    width: 100%; font: inherit; color: inherit; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px; cursor: pointer; min-height: 44px;
    transition: border-color .2s ease, transform .15s ease;
  }
  .tab:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tab .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-recruiters { background: #1F4FE0; }
  .dot-clients { background: #0B7A66; }
  .dot-personal { background: #B4237A; }
  .tab strong { display: block; font-family: var(--display); font-size: 1.3rem; letter-spacing: -0.01em; line-height: 1.25; }
  .tab .d { display: block; color: var(--muted); font-size: 1rem; }
  .tab .go { color: var(--muted); font-size: 1.2rem; transition: color .2s ease; }
  .tab:hover .go { color: var(--accent); }
  #cover .links { justify-content: flex-start; margin: 0; }

  .back {
    font: inherit; font-weight: 600; font-size: .95rem; color: var(--muted);
    background: none; border: 0; padding: 10px 0; min-height: 44px; cursor: pointer;
  }
  .back:hover { color: var(--accent); }

  footer { margin-top: 56px; color: var(--muted); font-size: .9rem; }
  #content > * { animation: fade .35s ease both; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

    ],
    contactTitle: "Say hello",
    contactText:  "The best place to reach me for non-work stuff is Instagram."
  }
};
/* ============== End of editable block ============== */


(function () {
  var VIEWS = SITE.views;
  var mode = VIEWS[0].key;

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function validKey(k) {
    if (k === "home" || k === "cover") return "cover";
    return VIEWS.some(function (v) { return v.key === k; }) ? k : null;
  }
  function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join("");
  }
  function readModeFromUrl() {
    var h = (location.hash || "").replace("#", "").toLowerCase();
    var q = "";
    try { q = (new URLSearchParams(location.search).get("mode") || "").toLowerCase(); } catch (e) {}
    return validKey(h) || validKey(q);
  }

  function section(titleText) {
    var s = el("section");
    s.appendChild(el("h2", null, titleText));
    return s;
  }
  function paragraphs(arr) {
    var f = document.createDocumentFragment();
    (arr || []).forEach(function (t) { f.appendChild(el("p", null, t)); });
    return f;
  }
  function chips(arr) {
    var ul = el("ul", "chips");
    (arr || []).forEach(function (t) { ul.appendChild(el("li", null, t)); });
    return ul;
  }
  function rows(items, whenKey, titleFn, textKey) {
    var ul = el("ul", "rows");
    (items || []).forEach(function (r) {
      var li = el("li");
      li.appendChild(el("div", "when", r[whenKey]));
      var w = el("div", "what");
      if (titleFn) w.appendChild(el("strong", null, titleFn(r)));
      w.appendChild(el("span", null, r[textKey]));
      li.appendChild(w);
      ul.appendChild(li);
    });
    return ul;
  }
  function cards(items) {
    var grid = el("div", "cards");
    (items || []).forEach(function (it) {
      var u = safeUrl(it.link);
      var card = u ? el("a") : el("div", "item");
      if (u) { card.href = u; card.target = "_blank"; card.rel = "noopener noreferrer"; }
      card.appendChild(el("h3", null, it.title));
      card.appendChild(el("p", null, it.desc));
      grid.appendChild(card);
    });
    return grid;
  }

  function contactBlock(data) {
    var L = SITE.links;
    var s = el("section");
    var box = el("div", "contact");
    box.appendChild(el("h2", null, data.contactTitle));
    box.appendChild(el("p", null, data.contactText));

    var options = {
      email:     L.email ? { href: "mailto:" + L.email, label: "Email me" } : null,
      linkedin:  safeUrl(L.linkedin)  ? { href: L.linkedin,  label: "Message me on LinkedIn" }  : null,
      instagram: safeUrl(L.instagram) ? { href: L.instagram, label: "Message me on Instagram" } : null
    };
    var pick = null;
    (data.contactVia || []).some(function (k) { if (options[k]) { pick = options[k]; return true; } return false; });
    if (pick) {
      var a = el("a", null, pick.label);
      a.href = pick.href;
      if (pick.href.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      box.appendChild(a);
    }
    s.appendChild(box);
    return s;
  }

  function renderLinks(lead, navId) {
    var nav = $(navId || "links");
    nav.textContent = "";
    var L = SITE.links;
    var defs = [
      ["linkedin", "LinkedIn"], ["instagram", "Instagram"], ["email", "Email"],
      ["tiktok", "TikTok"], ["youtube", "YouTube"], ["x", "X"], ["github", "GitHub"]
    ];
    var ordered = defs.slice().sort(function (a, b) { return (b[0] === lead) - (a[0] === lead); });
    ordered.forEach(function (d) {
      var val = L[d[0]];
      if (!val) return;
      var a = el("a", d[0] === lead ? "primary" : "", d[1]);
      if (d[0] === "email") a.href = "mailto:" + val;
      else { var u = safeUrl(val); if (!u) return; a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      nav.appendChild(a);
    });
  }

  var RENDERERS = {
    recruiters: function (root, D) {
      var about = section("About"); about.appendChild(paragraphs(D.about)); root.appendChild(about);
      var st = section(D.strengthsTitle); st.appendChild(chips(D.strengths)); root.appendChild(st);
      var how = section(D.howTitle); how.appendChild(rows(D.how, "label", null, "text")); root.appendChild(how);
      var ex = section(D.experienceTitle);
      ex.appendChild(rows(D.experience, "when", function (r) { return r.title + ", " + r.place; }, "note"));
      root.appendChild(ex);
      root.appendChild(contactBlock(D));
    },
    clients: function (root, D) {
      var about = section("About"); about.appendChild(paragraphs(D.about)); root.appendChild(about);
      var h = section(D.helpTitle); h.appendChild(chips(D.help)); root.appendChild(h);
      var o = section(D.offersTitle); o.appendChild(cards(D.offers)); root.appendChild(o);
      var p = section(D.processTitle); p.appendChild(rows(D.process, "label", null, "text")); root.appendChild(p);
      root.appendChild(contactBlock(D));
    },
    personal: function (root, D) {
      var about = section("A bit about me"); about.appendChild(paragraphs(D.about)); root.appendChild(about);
      var l = section(D.lovesTitle); l.appendChild(chips(D.loves)); root.appendChild(l);
      var la = section(D.latelyTitle); la.appendChild(rows(D.lately, "label", null, "text")); root.appendChild(la);
      root.appendChild(contactBlock(D));
    }
  };

  function renderSwitch() {
    var wrap = $("switch");
    wrap.textContent = "";
    VIEWS.forEach(function (v) {
      var b = el("button", null, v.label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(v.key === mode));
      b.addEventListener("click", function () { setMode(v.key, true); });
      wrap.appendChild(b);
    });
  }

  function renderCover() {
    $("cover-tag").textContent = SITE.cover.tagline;
    var t = $("tabs");
    t.textContent = "";
    VIEWS.forEach(function (v) {
      var b = el("button", "tab");
      b.type = "button";
      b.appendChild(el("span", "dot dot-" + v.key));
      var mid = el("span");
      mid.appendChild(el("strong", null, v.label));
      mid.appendChild(el("span", "d", (SITE.cover.tabDescriptions || {})[v.key] || ""));
      b.appendChild(mid);
      b.appendChild(el("span", "go", "\u2192"));
      b.addEventListener("click", function () { setMode(v.key, true); });
      t.appendChild(b);
    });
    renderLinks(null, "cover-links");
  }

  function render() {
    document.documentElement.setAttribute("data-mode", mode);
    try {
      var bgc = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      if (bgc) document.querySelector('meta[name="theme-color"]').setAttribute("content", bgc);
    } catch (e) {}
    var isCover = mode === "cover";
    $("cover").hidden = !isCover;
    $("page").hidden = isCover;
    try { window.scrollTo(0, 0); } catch (e) {}
    if (isCover) { renderCover(); return; }
    var D = SITE[mode];
    $("tagline").textContent = D.tagline;
    renderSwitch();
    renderLinks(D.lead);
    var root = $("content");
    root.textContent = "";
    RENDERERS[mode](root, D);
  }

  function setMode(m, updateUrl) {
    mode = m;
    render();
    if (updateUrl) { try { history.replaceState(null, "", "#" + (m === "cover" ? "home" : m)); } catch (e) {} }
  }

  // Turns the photo into a round browser-tab icon
  function setPhotoFavicon(src) {
    var im = new Image();
    im.onload = function () {
      var c = document.createElement("canvas");
      c.width = c.height = 64;
      var x = c.getContext("2d");
      x.beginPath(); x.arc(32, 32, 32, 0, Math.PI * 2); x.closePath(); x.clip();
      var s = Math.min(im.width, im.height) * 0.9;   // zoom in a little so the face reads at tiny size
      x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 64, 64);
      var l = document.getElementById("favicon");
      l.type = "image/png";
      l.href = c.toDataURL("image/png");
    };
    im.src = src;
  }

  // Static parts
  document.title = SITE.name;
  // Puts the first name on one line and the rest on the next
  function stackName(node, full) {
    var words = full.trim().split(/\s+/);
    node.textContent = "";
    node.appendChild(document.createTextNode(words[0] + " "));
    if (words.length > 1) {
      node.appendChild(document.createElement("br"));
      var hl = document.createElement("span");
      hl.className = "hl";
      hl.textContent = words.slice(1).join(" ");
      node.appendChild(hl);
    }
  }
  stackName($("name"), SITE.name);
  stackName($("cover-name"), SITE.name);
  $("where").textContent = SITE.location || "";
  var hasPhoto = SITE.photo && /^data:image\//.test(SITE.photo);
  [$("avatar"), $("cover-photo")].forEach(function (box) {
    if (hasPhoto) {
      var im = document.createElement("img");
      im.src = SITE.photo; im.alt = "";
      box.appendChild(im);
    } else {
      box.textContent = initials(SITE.name);
    }
  });
  if (hasPhoto) setPhotoFavicon(SITE.photo);
  $("footer").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

  $("back").addEventListener("click", function () { setMode("cover", true); });
  window.addEventListener("hashchange", function () {
    var m = readModeFromUrl();
    if (m && m !== mode) setMode(m, false);
  });

  mode = readModeFromUrl() || "cover";
  render();
})();
</script>
</body>
</html>
