<!DOCTYPE html>
<html lang="en" data-mode="recruiters">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seerat Kohli</title>
<meta name="description" content="Seerat Kohli: strategic, data-forward product manager with 6+ years of experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Colors: one palette per view ---------- */
  :root {
    --bg: #F2F4F8; --surface: #FFFFFF; --ink: #101828; --muted: #566074; --line: #D5DAE3;
    --accent: #1F4FE0; --accent-ink: #FFFFFF; --accent-soft: #E3EAFF;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-mode="clients"] {
    --bg: #EDF6F2; --surface: #FFFFFF; --ink: #0F2A24; --muted: #4F6A63; --line: #CFE0DA;
    --accent: #0B7A66; --accent-ink: #FFFFFF; --accent-soft: #D3EDE4;
  }
  :root[data-mode="personal"] {
    --bg: #F8F1F8; --surface: #FFFFFF; --ink: #2A1230; --muted: #6D5675; --line: #E6D3E8;
    --accent: #B4237A; --accent-ink: #FFFFFF; --accent-soft: #F6D9EA;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1424; --surface: #161E33; --ink: #E8ECF5; --muted: #9AA5BD; --line: #26304A;
      --accent: #7C9BFF; --accent-ink: #0E1424; --accent-soft: #1E2A52; color-scheme: dark;
    }
    :root:not([data-theme="light"])[data-mode="clients"] {
      --bg: #0C1B18; --surface: #12261F; --ink: #E6F4EF; --muted: #9BBBB1; --line: #21433A;
      --accent: #4FD1B5; --accent-ink: #0C1B18; --accent-soft: #17403A;
    }
    :root:not([data-theme="light"])[data-mode="personal"] {
      --bg: #1A1020; --surface: #241730; --ink: #F5E9F7; --muted: #BBA3C3; --line: #41284F;
      --accent: #FF7AC3; --accent-ink: #1A1020; --accent-soft: #4A1F3C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1424; --surface: #161E33; --ink: #E8ECF5; --muted: #9AA5BD; --line: #26304A;
    --accent: #7C9BFF; --accent-ink: #0E1424; --accent-soft: #1E2A52; color-scheme: dark;
  }
  :root[data-theme="dark"][data-mode="clients"] {
    --bg: #0C1B18; --surface: #12261F; --ink: #E6F4EF; --muted: #9BBBB1; --line: #21433A;
    --accent: #4FD1B5; --accent-ink: #0C1B18; --accent-soft: #17403A;
  }
  :root[data-theme="dark"][data-mode="personal"] {
    --bg: #1A1020; --surface: #241730; --ink: #F5E9F7; --muted: #BBA3C3; --line: #41284F;
    --accent: #FF7AC3; --accent-ink: #1A1020; --accent-soft: #4A1F3C;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 22px 64px; }

  /* ---------- Hero ---------- */
  .hero { padding: 28px 0 8px; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 26px;
    margin-bottom: 22px; overflow: hidden;
    transition: background-color .35s ease, color .35s ease;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(3rem, 14vw, 5.6rem); line-height: .95; letter-spacing: -0.035em;
    margin: 0 0 18px;
  }
  .where { color: var(--muted); font-size: .95rem; margin: -6px 0 18px; }
  .where:empty { display: none; }
  .tagline { font-size: 1.2rem; color: var(--muted); max-width: 36ch; margin: 0 0 26px; min-height: 5.2em; }
  @media (min-width: 560px) { .tagline { min-height: 3.9em; } }

  /* ---------- View switch ---------- */
  .switch {
    display: inline-flex; flex-wrap: wrap; padding: 4px; gap: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 26px;
  }
  .switch button {
    font: inherit; font-weight: 600; font-size: .95rem;
    border: 0; background: transparent; color: var(--muted);
    padding: 10px 16px; border-radius: 999px; cursor: pointer; min-height: 44px;
    transition: background-color .25s ease, color .25s ease;
  }
  .switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* ---------- Links ---------- */
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 8px; }
  .links a {
    text-decoration: none; font-weight: 600; font-size: .98rem;
    padding: 11px 18px; border-radius: 12px; min-height: 44px;
    border: 1px solid var(--line); background: var(--surface);
    transition: border-color .2s ease;
  }
  .links a:hover { border-color: var(--accent); }
  .links a.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* ---------- Sections ---------- */
  section { margin-top: 56px; }
  h2 { font-family: var(--display); font-weight: 700; font-size: 1.7rem; letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 18px; }
  p { margin: 0 0 1em; max-width: 62ch; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
  .chips li {
    background: var(--accent-soft); color: var(--ink);
    padding: 6px 14px; border-radius: 999px; font-size: .95rem; font-weight: 500;
    transition: background-color .35s ease;
  }

  .rows { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .rows li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 6px 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .rows .when { color: var(--accent); font-weight: 600; font-size: .95rem; transition: color .35s ease; }
  .rows .what strong { display: block; font-weight: 600; font-size: 1.05rem; }
  .rows .what span { color: var(--muted); }
  @media (max-width: 520px) { .rows li { grid-template-columns: 1fr; } }

  .cards { display: grid; gap: 14px; }
  .cards a, .cards div.item {
    display: block; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 22px; transition: border-color .2s ease;
  }
  .cards a:hover { border-color: var(--accent); }
  .cards h3 { font-family: var(--display); font-size: 1.2rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .cards p { margin: 0; color: var(--muted); }

  .contact {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 22px; padding: 30px 26px;
    transition: background-color .35s ease, color .35s ease;
  }
  .contact h2 { margin-bottom: 8px; }
  .contact p { margin-bottom: 18px; }
  .contact a {
    display: inline-block; text-decoration: none; font-weight: 600;
    background: var(--accent-ink); color: var(--accent);
    padding: 12px 20px; border-radius: 12px; min-height: 44px;
  }

  footer { margin-top: 56px; color: var(--muted); font-size: .9rem; }
  #content > * { animation: fade .35s ease both; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <h1 id="name"></h1>
    <p class="where" id="where"></p>
    <p class="tagline" id="tagline"></p>
    <div class="switch" role="group" aria-label="Choose your view" id="switch"></div>
    <nav class="links" id="links" aria-label="Social and contact links"></nav>
  </header>

  <main id="content"></main>
  <footer id="footer"></footer>
</div>

<script>
/* ==========================================================
   EDIT THIS BLOCK ONLY. Everything on the page comes from here.
   Change the text between the quotes. Keep the quotes and commas.
   Lines marked  >> ADD <<  are placeholders for you to fill in.
   ========================================================== */
const SITE = {
  name: "Seerat Kohli",
  location: "",            // e.g. "New York, NY". Leave "" to hide.

  // Optional photo: paste a data URI (data:image/jpeg;base64,...). Leave "" for initials.
  photo: "",

  // Leave any link as "" to hide it.
  links: {
    linkedin:  "https://www.linkedin.com/in/seeratkohli/",
    instagram: "https://www.instagram.com/SeeratKohlii/",
    email:     "",         // >> ADD << your public email if you want one
    tiktok:    "",
    youtube:   "",
    x:         "",
    github:    ""
  },

  // The three views and the names on the switch buttons.
  views: [
    { key: "recruiters", label: "Recruiters"   },
    { key: "clients",    label: "Clients"      },
    { key: "personal",   label: "Off the clock" }
  ],

  /* ---------- VIEW 1: Recruiters (your product career) ---------- */
  recruiters: {
    lead: "linkedin",                      // which button is highlighted
    contactVia: ["email", "linkedin"],     // first one that exists is used
    tagline: "Strategic, data-forward product manager with 6+ years of turning messy problems into products people use.",
    about: [
      "I'm a product manager who starts with the customer problem, backs decisions with data, and works closely with engineering and design to ship things that matter.",
      "Over 6+ years I've learned that great product work is equal parts strategy and follow-through: knowing what to build, why now, and how we'll know it worked."
    ],
    strengthsTitle: "What I bring",
    strengths: ["Product strategy", "Roadmapping", "Data and analytics", "Experimentation", "Stakeholder alignment", "Cross-functional leadership"],
    howTitle: "How I work",
    how: [
      { label: "Strategy", text: "Start with the customer problem and the business goal, then decide what not to build." },
      { label: "Data",     text: "Define success metrics up front, instrument early, and let the numbers settle debates." },
      { label: "Delivery", text: "Keep scope tight, communicate clearly, and ship in steps that teach the team something." },
      { label: "People",   text: "Make decisions with engineering, design and stakeholders, not for them." }
    ],
    experienceTitle: "Experience",
    experience: [
      { when: ">> ADD << years", title: "Product Manager", place: ">> ADD << company", note: ">> ADD << one line on what you owned and a result you can point to." },
      { when: ">> ADD << years", title: ">> ADD << role",  place: ">> ADD << company", note: ">> ADD << one line about the impact you had." },
      { when: ">> ADD << years", title: ">> ADD << role",  place: ">> ADD << company", note: ">> ADD << one line about the impact you had." }
    ],
    contactTitle: "Hiring for a product role?",
    contactText:  "I'd love to hear what you're building. Let's talk."
  },

  /* ---------- VIEW 2: Clients (your side-gig) ---------- */
  clients: {
    lead: "linkedin",
    contactVia: ["email", "linkedin", "instagram"],
    tagline: "Need a product brain on the side? I help founders and small teams turn ideas and data into clear next steps.",
    about: [
      "Alongside my full-time product work, I take on a small number of side projects where a fresh, strategic and data-minded perspective can move things forward faster.",
      "If you're stuck choosing what to build, unsure which numbers matter, or need a plan your team can actually follow, I can help."
    ],
    helpTitle: "How I can help",
    help: ["Product strategy", "Roadmap planning", "Metrics and dashboards", "Customer research", "Prioritization", "Launch planning"],
    offersTitle: "Ways to work together",
    // >> ADD << Replace these three with your real offers and prices/timelines if you like.
    offers: [
      { title: "Strategy session",      desc: "A focused conversation to untangle your biggest product question and leave with next steps.", link: "" },
      { title: "Metrics review",        desc: "We look at your data together and decide which numbers to track and what they're telling you.", link: "" },
      { title: "Roadmap sprint",        desc: "A short project to turn your goals into a clear, prioritized plan.", link: "" }
    ],
    processTitle: "How it works",
    process: [
      { label: "Intro call", text: "We chat about your goals and see if I'm the right fit." },
      { label: "Scope",      text: "I send a short plan with what you'll get and when." },
      { label: "Delivery",   text: "We work together and you finish with something you can use right away." }
    ],
    contactTitle: "Start a conversation",
    contactText:  "Tell me a little about what you're working on."
  },

  /* ---------- VIEW 3: Off the clock (personal) ---------- */
  personal: {
    lead: "instagram",
    contactVia: ["instagram", "email", "linkedin"],
    tagline: "The side of me that doesn't fit on a résumé.",
    about: [
      "When I'm not working on roadmaps and metrics, this is where you'll find the rest of me.",
      "I share more day to day on Instagram, so come say hi."
    ],
    lovesTitle: "Things I love",
    loves: [">> ADD << a thing you love", ">> ADD << another", ">> ADD << one more"],
    latelyTitle: "Lately",
    lately: [
      { label: "Reading",  text: ">> ADD << what's on your nightstand." },
      { label: "Watching", text: ">> ADD << what you're into right now." },
      { label: "Planning", text: ">> ADD << a trip, a project, a goal." }
    ],
    contactTitle: "Say hello",
    contactText:  "The best place to reach me for non-work stuff is Instagram."
  }
};
/* ============== End of editable block ============== */


(function () {
  var VIEWS = SITE.views;
  var mode = VIEWS[0].key;

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function validKey(k) { return VIEWS.some(function (v) { return v.key === k; }) ? k : null; }
  function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join("");
  }
  function readModeFromUrl() {
    var h = (location.hash || "").replace("#", "").toLowerCase();
    var q = "";
    try { q = (new URLSearchParams(location.search).get("mode") || "").toLowerCase(); } catch (e) {}
    return validKey(h) || validKey(q);
  }

  function section(titleText) {
    var s = el("section");
    s.appendChild(el("h2", null, titleText));
    return s;
  }
  function paragraphs(arr) {
    var f = document.createDocumentFragment();
    (arr || []).forEach(function (t) { f.appendChild(el("p", null, t)); });
    return f;
  }
  function chips(arr) {
    var ul = el("ul", "chips");
    (arr || []).forEach(function (t) { ul.appendChild(el("li", null, t)); });
    return ul;
  }
  function rows(items, whenKey, titleFn, textKey) {
    var ul = el("ul", "rows");
    (items || []).forEach(function (r) {
      var li = el("li");
      li.appendChild(el("div", "when", r[whenKey]));
      var w = el("div", "what");
      if (titleFn) w.appendChild(el("strong", null, titleFn(r)));
      w.appendChild(el("span", null, r[textKey]));
      li.appendChild(w);
      ul.appendChild(li);
    });
    return ul;
  }
  function cards(items) {
    var grid = el("div", "cards");
    (items || []).forEach(function (it) {
      var u = safeUrl(it.link);
      var card = u ? el("a") : el("div", "item");
      if (u) { card.href = u; card.target = "_blank"; card.rel = "noopener noreferrer"; }
      card.appendChild(el("h3", null, it.title));
      card.appendChild(el("p", null, it.desc));
      grid.appendChild(card);
    });
    return grid;
  }

  function contactBlock(data) {
    var L = SITE.links;
    var s = el("section");
    var box = el("div", "contact");
    box.appendChild(el("h2", null, data.contactTitle));
    box.appendChild(el("p", null, data.contactText));

    var options = {
      email:     L.email ? { href: "mailto:" + L.email, label: "Email me" } : null,
      linkedin:  safeUrl(L.linkedin)  ? { href: L.linkedin,  label: "Message me on LinkedIn" }  : null,
      instagram: safeUrl(L.instagram) ? { href: L.instagram, label: "Message me on Instagram" } : null
    };
    var pick = null;
    (data.contactVia || []).some(function (k) { if (options[k]) { pick = options[k]; return true; } return false; });
    if (pick) {
      var a = el("a", null, pick.label);
      a.href = pick.href;
      if (pick.href.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      box.appendChild(a);
    }
    s.appendChild(box);
    return s;
  }

  function renderLinks(lead) {
    var nav = $("links");
    nav.textContent = "";
    var L = SITE.links;
    var defs = [
      ["linkedin", "LinkedIn"], ["instagram", "Instagram"], ["email", "Email"],
      ["tiktok", "TikTok"], ["youtube", "YouTube"], ["x", "X"], ["github", "GitHub"]
    ];
    var ordered = defs.slice().sort(function (a, b) { return (b[0] === lead) - (a[0] === lead); });
    ordered.forEach(function (d) {
      var val = L[d[0]];
      if (!val) return;
      var a = el("a", d[0] === lead ? "primary" : "", d[1]);
      if (d[0] === "email") a.href = "mailto:" + val;
      else { var u = safeUrl(val); if (!u) return; a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      nav.appendChild(a);
    });
  }

  var RENDERERS = {
    recruiters: function (root, D) {
      var about = section("About"); about.appendChild(paragraphs(D.about)); root.appendChild(about);
      var st = section(D.strengthsTitle); st.appendChild(chips(D.strengths)); root.appendChild(st);
      var how = section(D.howTitle); how.appendChild(rows(D.how, "label", null, "text")); root.appendChild(how);
      var ex = section(D.experienceTitle);
      ex.appendChild(rows(D.experience, "when", function (r) { return r.title + ", " + r.place; }, "note"));
      root.appendChild(ex);
      root.appendChild(contactBlock(D));
    },
    clients: function (root, D) {
      var about = section("About"); about.appendChild(paragraphs(D.about)); root.appendChild(about);
      var h = section(D.helpTitle); h.appendChild(chips(D.help)); root.appendChild(h);
      var o = section(D.offersTitle); o.appendChild(cards(D.offers)); root.appendChild(o);
      var p = section(D.processTitle); p.appendChild(rows(D.process, "label", null, "text")); root.appendChild(p);
      root.appendChild(contactBlock(D));
    },
    personal: function (root, D) {
      var about = section("A bit about me"); about.appendChild(paragraphs(D.about)); root.appendChild(about);
      var l = section(D.lovesTitle); l.appendChild(chips(D.loves)); root.appendChild(l);
      var la = section(D.latelyTitle); la.appendChild(rows(D.lately, "label", null, "text")); root.appendChild(la);
      root.appendChild(contactBlock(D));
    }
  };

  function renderSwitch() {
    var wrap = $("switch");
    wrap.textContent = "";
    VIEWS.forEach(function (v) {
      var b = el("button", null, v.label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(v.key === mode));
      b.addEventListener("click", function () { setMode(v.key, true); });
      wrap.appendChild(b);
    });
  }

  function render() {
    var D = SITE[mode];
    document.documentElement.setAttribute("data-mode", mode);
    $("tagline").textContent = D.tagline;
    renderSwitch();
    renderLinks(D.lead);
    var root = $("content");
    root.textContent = "";
    RENDERERS[mode](root, D);
  }

  function setMode(m, updateUrl) {
    mode = m;
    render();
    if (updateUrl) { try { history.replaceState(null, "", "#" + m); } catch (e) {} }
  }

  // Static parts
  document.title = SITE.name;
  $("name").textContent = SITE.name;
  $("where").textContent = SITE.location || "";
  var av = $("avatar");
  if (SITE.photo && /^data:image\//.test(SITE.photo)) {
    var img = document.createElement("img");
    img.src = SITE.photo; img.alt = "";
    av.appendChild(img);
  } else {
    av.textContent = initials(SITE.name);
  }
  $("footer").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

  window.addEventListener("hashchange", function () {
    var m = readModeFromUrl();
    if (m && m !== mode) setMode(m, false);
  });

  mode = readModeFromUrl() || VIEWS[0].key;
  render();
})();
</script>
</body>
</html>
