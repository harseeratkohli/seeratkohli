<style>
  /* ---------- Colors: cream cover, monochrome tabs, one orange ---------- */
  /* To change the orange everywhere, change the four orange values below (--accent, --accent-text, --pop, --orange) in the first block. */
  :root {
    --bg: #FBF6EA;          /* cream / ivory backdrop */
    --surface: #FFFDF7;     /* cards sit a touch lighter */
    --ink: #1C1A16;         /* text */
    --muted: #5F5A4E;       /* secondary text */
    --line: #E4DAC4;        /* borders and dividers */
    --accent: #CC470A;      /* buttons on the cover */
    --accent-ink: #FFFFFF;  /* text on those buttons */
    --accent-soft: #F4E8D2; /* soft chips and hovers */
    --accent-text: #B33C07; /* orange used for small text */
    --pop: #CC470A;         /* orange accent bars */
    --orange: #CC470A;      /* contact blocks */
    --display: "Space Grotesk", "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Inside the tabs: black, white and warm gray, with the orange as the only color. */
  :root[data-mode="recruiters"] {
    --bg: #F5F2EB; --surface: #FFFFFF; --ink: #1C1A16; --muted: #5C574C; --line: #DCD5C6;
    --accent: #1C1A16; --accent-ink: #FBF6EA; --accent-soft: #E9E4D8; --accent-text: #B33C07; --pop: #CC470A;
  }
  :root[data-mode="clients"] {
    --bg: #F0E9DA; --surface: #FFFDF7; --ink: #1C1A16; --muted: #5C574C; --line: #D9CEB7;
    --accent: #1C1A16; --accent-ink: #FBF6EA; --accent-soft: #E6DCC6; --accent-text: #B33C07; --pop: #CC470A;
  }
  :root[data-mode="personal"] {
    --bg: #EAE5DC; --surface: #FBF9F4; --ink: #1C1A16; --muted: #5C574C; --line: #D2CBBC;
    --accent: #1C1A16; --accent-ink: #FBF6EA; --accent-soft: #DCD5C7; --accent-text: #B33C07; --pop: #CC470A;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 18px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 22px 64px; }

  /* ---------- Hero ---------- */
  .hero { padding: 28px 0 8px; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 26px;
    margin-bottom: 22px; overflow: hidden;
    transition: background-color .35s ease, color .35s ease;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(4rem, 24vw, 7.5rem); line-height: .95; letter-spacing: -0.03em;
    margin: 0 0 18px;
  }
  .where { color: var(--muted); font-size: .95rem; margin: -6px 0 18px; }
  .where:empty { display: none; }
  .tagline { font-size: 1.3rem; color: var(--muted); max-width: 36ch; margin: 0 0 26px; min-height: 5.2em; }
  @media (min-width: 560px) { .tagline { min-height: 3.9em; } }

  /* ---------- View switch ---------- */
  .switch {
    display: inline-flex; flex-wrap: wrap; padding: 4px; gap: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 26px;
  }
  .switch button {
    font: inherit; font-weight: 600; font-size: .95rem;
    border: 0; background: transparent; color: var(--muted);
    padding: 10px 16px; border-radius: 999px; cursor: pointer; min-height: 44px;
    transition: background-color .25s ease, color .25s ease;
  }
  .switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* ---------- Links ---------- */
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 8px; }
  .links a {
    text-decoration: none; font-weight: 600; font-size: .98rem;
    padding: 11px 18px; border-radius: 12px; min-height: 44px;
    border: 1px solid var(--line); background: var(--surface);
    transition: border-color .2s ease;
  }
  .links a:hover { border-color: var(--accent); }
  .links a.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* ---------- Sections ---------- */
  section { margin-top: 56px; }
  h2 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; letter-spacing: -0.01em; line-height: 1.2; margin: 0 0 18px; }
  #page h2::before { content: ""; display: block; width: 44px; height: 6px; border-radius: 3px; background: var(--pop); margin-bottom: 14px; }
  #page .hl { color: var(--accent-text); }
  p { margin: 0 0 1em; max-width: 62ch; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
  .chips li {
    background: var(--accent-soft); color: var(--ink);
    padding: 6px 14px; border-radius: 999px; font-size: 1rem; font-weight: 500;
    transition: background-color .35s ease;
  }

  .rows { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .rows li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 6px 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .rows .when { color: var(--accent-text); font-weight: 600; font-size: .95rem; transition: color .35s ease; }
  .rows .what strong { display: block; font-weight: 600; font-size: 1.15rem; }
  .rows .what span { color: var(--muted); }
  @media (max-width: 520px) { .rows li { grid-template-columns: 1fr; } }

  .cards { display: grid; gap: 14px; }
  .cards a, .cards div.item {
    display: block; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 22px; transition: border-color .2s ease;
  }
  .cards a:hover { border-color: var(--accent); }
  .cards h3 { font-family: var(--display); font-size: 1.3rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .cards p { margin: 0; color: var(--muted); }

  .contact {
    background: var(--orange); color: var(--accent-ink);
    border-radius: 22px; padding: 30px 26px;
    transition: background-color .35s ease, color .35s ease;
  }
  .contact h2 { margin-bottom: 8px; }
  .contact p { margin-bottom: 18px; }
  .contact a {
    display: inline-block; text-decoration: none; font-weight: 600;
    background: var(--accent-ink); color: var(--accent);
    padding: 12px 20px; border-radius: 12px; min-height: 44px;
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .stat strong { display: block; font-family: var(--display); font-size: 2.2rem; line-height: 1.1; letter-spacing: -0.02em; color: var(--accent-text); }
  .stat span { color: var(--muted); font-size: 1rem; }
  .rows .bul { margin: 10px 0 0; padding-left: 1.1em; }
  .rows .bul li { display: list-item; border: 0; padding: 3px 0; color: var(--ink); }
  .cards .price { margin-top: 12px; font-weight: 600; color: var(--accent-text); }

  .credential { display: flex; align-items: center; gap: 18px; margin-top: 22px; padding: 16px 18px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; transition: border-color .2s ease; }
  a.credential:hover { border-color: var(--accent); }
  .credential .seal { flex: none; width: 96px; height: 96px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; padding: 6px; }
  .credential .seal img { width: 100%; height: 100%; display: block; }
  .credential .ctext strong { display: block; font-family: var(--display); font-size: 1.2rem; letter-spacing: -0.01em; line-height: 1.25; margin-bottom: 4px; }
  .credential .ctext span { color: var(--muted); font-size: 1rem; line-height: 1.5; }
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 24px; }
  .gallery figure { margin: 0; }
  .gallery img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 14px; display: block; }
  .gallery figcaption { color: var(--muted); font-size: .95rem; margin-top: 8px; }
  .gallery .ph { aspect-ratio: 4 / 5; border: 2px dashed var(--line); border-radius: 14px; display: grid; place-items: center; text-align: center; padding: 12px; color: var(--muted); font-size: .95rem; }

  .companies { border-top: 1px solid var(--line); }
  @media (max-width: 520px) { .rows.exp li { grid-template-columns: 6.4rem 1fr; gap: 6px 14px; } }
  .company { padding: 24px 0; border-bottom: 1px solid var(--line); }
  .co { font-family: var(--display); font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; margin: 0 0 6px; }
  .co-years { color: var(--accent-text); font-weight: 600; }

    bioTitle: "My story",
    bio: [
      "I was born and raised on Long Island, New York, and I'm blending ancient traditions with modern living. Rooted in my Sikh heritage, with family origins in Rawalpindi and Lahore, Pakistan, and later New Delhi, India, I carry both cultural legacy and personal authenticity into my teaching.",
      "I spent more than six years in the fast-paced corporate world, including roles in non-profit and traditional finance. Long commutes, corporate restructurings and workplace dynamics led me to reconnect with my inner child and a balanced, purpose-driven life.",
      "My earliest introduction to yoga came at age 8, when my mother guided me through nasal breathing exercises while we watched Yoga for You, a Saturday morning show from India on the Zee TV channel.",
      "My approach to life and teaching is inspired by my Sikh roots and a modern expression of Grihasti Jeevan, the householder's path. I believe in integrating spiritual wisdom with everyday responsibilities: pursuing a career, keeping family ties, and living authentically in today's world. Whether wearing my kara or keeping my kesh, I choose a path of conscious living.",
      "Through yoga, mindfulness and community connection, I'm passionate about guiding others to find their own balance between hustle and holistic healing."
    ],
    bioLink: { label: "Learn more about Grihasti Jeevan", href: "https://www.sikhphilosophy.net/threads/grihasti-jeevan-married-life-what-does-it-really-mean.40189/" },
    storyTitle: "Training in Rishikesh",
    story: [
      "In the fall of 2024, a mother-daughter journey took me from New York to Rishikesh, India, the yoga capital of the world. Over 25 days at Rudra Yogpeeth in Upper Tapovan, I completed my 200-hour yoga teacher training, developing my teaching of Hatha and Ashtanga Vinyasa while studying the Iyengar method.",
      "That experience earned me my 200-hour Registered Yoga Teacher (RYT) certification from Yoga Alliance."
    ],

      "I grew up watching Yoga for You on Saturday mornings with my mother, and I still believe in the best of both worlds, a lesson I credit to my favorite childhood show, Hannah Montana."
    ],
    lovesTitle: "Things I love",
    loves: ["Yoga", "Chai", "Yogic philosophy", "The Ganges", "Family", "Kind souls"],
    latelyTitle: "Lately",
    lately: [
      { label: "Reading",  text: ">> ADD << what's on your nightstand." },
      { label: "Watching", text: ">> ADD << what you're into right now." },
      { label: "Planning", text: ">> ADD << a trip, a project, a goal." }
    ],
    contactTitle: "Say hello",
    contactText:  "The best place to reach me for non-work stuff is Instagram."
  }
};
/* ============== End of editable block ============== */


(function () {
  var VIEWS = SITE.views;
  var mode = VIEWS[0].key;

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function validKey(k) {
    if (k === "home" || k === "cover") return "cover";
    return VIEWS.some(function (v) { return v.key === k; }) ? k : null;
  }
  function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join("");
  }
  function readModeFromUrl() {
    var h = (location.hash || "").replace("#", "").toLowerCase();
    var q = "";
    try { q = (new URLSearchParams(location.search).get("mode") || "").toLowerCase(); } catch (e) {}
    return validKey(h) || validKey(q);
  }

  function section(titleText) {
    var s = el("section");
    s.appendChild(el("h2", null, titleText));
    return s;
  }
  function paragraphs(arr) {
    var f = document.createDocumentFragment();
    (arr || []).forEach(function (t) { f.appendChild(el("p", null, t)); });
    return f;
  }
  function chips(arr) {
    var ul = el("ul", "chips");
    (arr || []).forEach(function (t) { ul.appendChild(el("li", null, t)); });
    return ul;
  }
  function rows(items, whenKey, titleFn, textKey) {
    var ul = el("ul", "rows");
    (items || []).forEach(function (r) {
      var li = el("li");
      li.appendChild(el("div", "when", r[whenKey]));
      var w = el("div", "what");
      if (titleFn) w.appendChild(el("strong", null, titleFn(r)));
      w.appendChild(el("span", null, r[textKey]));
      li.appendChild(w);
      ul.appendChild(li);
    });
    return ul;
  }
  function cards(items) {
    var grid = el("div", "cards");
    (items || []).forEach(function (it) {
      var u = safeUrl(it.link);
      var card = u ? el("a") : el("div", "item");
      if (u) { card.href = u; card.target = "_blank"; card.rel = "noopener noreferrer"; }
      card.appendChild(el("h3", null, it.title));
      card.appendChild(el("p", null, it.desc));
      if (it.price) card.appendChild(el("div", "price", it.price));
      grid.appendChild(card);
    });
    return grid;
  }

  function contactBlock(data) {
    var L = SITE.links;
    var s = el("section");
    var box = el("div", "contact");
    box.appendChild(el("h2", null, data.contactTitle));
    box.appendChild(el("p", null, data.contactText));

    var email = (data.email !== undefined && data.email !== null) ? data.email : L.email;
    var buttons = [];
    if (safeUrl(data.bookingUrl)) buttons.push({ href: data.bookingUrl, label: data.bookingLabel || "Book a free intro chat" });
    if (email) {
      var q = [];
      if (data.emailSubject) q.push("subject=" + encodeURIComponent(data.emailSubject));
      if (data.emailBody) q.push("body=" + encodeURIComponent(data.emailBody));
      buttons.push({ href: "mailto:" + email + (q.length ? "?" + q.join("&") : ""), label: "Email me" });
    }
    if (!buttons.length) {
      var options = {
        linkedin:  safeUrl(L.linkedin)  ? { href: L.linkedin,  label: "Message me on LinkedIn" }  : null,
        instagram: safeUrl(L.instagram) ? { href: L.instagram, label: "Message me on Instagram" } : null
      };
      (data.contactVia || []).some(function (k) { if (options[k]) { buttons.push(options[k]); return true; } return false; });
    }
    buttons.forEach(function (b, i) {
      var a = el("a", i ? "alt" : null, b.label);
      a.href = b.href;
      if (b.href.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      box.appendChild(a);
    });
    s.appendChild(box);
    return s;
  }

  function renderLinks(lead, navId, emailOverride, only) {
    var nav = $(navId || "links");
    nav.textContent = "";
    var L = SITE.links;
    var defs = [
      ["linkedin", "LinkedIn"], ["instagram", "Instagram"], ["email", "Email"],
      ["tiktok", "TikTok"], ["linktree", "Linktree"], ["lafitness", "Class schedule"], ["youtube", "YouTube"], ["x", "X"], ["github", "GitHub"]
    ];
    var ordered = defs.slice().sort(function (a, b) { return (b[0] === lead) - (a[0] === lead); });
    ordered.forEach(function (d) {
      var val = L[d[0]];
      if (d[0] === "email" && emailOverride !== undefined && emailOverride !== null) val = emailOverride;
      if (only && only.indexOf(d[0]) === -1) return;
      if (!val) return;
      var a = el("a", d[0] === lead ? "primary" : "", d[1]);
      if (d[0] === "email") a.href = "mailto:" + val;
      else { var u = safeUrl(val); if (!u) return; a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      nav.appendChild(a);
    });
  }

  function gallery(photos) {
    var g = el("div", "gallery");
    if (photos && photos.length) {
      photos.forEach(function (ph) {
        var f = el("figure");
        if (ph.src && /^data:image\//.test(ph.src)) {
          var im = document.createElement("img");
          im.src = ph.src; im.alt = ph.alt || ph.caption || "";
          f.appendChild(im);
        }
        if (ph.caption) f.appendChild(el("figcaption", null, ph.caption));
        g.appendChild(f);
      });
    } else {
      for (var i = 1; i <= 3; i++) {
        var f2 = el("figure");
        f2.appendChild(el("div", "ph", ">> ADD << Rishikesh photo " + i));
        g.appendChild(f2);
      }
    }
    return g;
  }

  function credentialCard(c) {
    var link = safeUrl(c.link);
    var box = link ? el("a", "credential") : el("div", "credential");
    if (link) { box.href = link; box.target = "_blank"; box.rel = "noopener noreferrer"; }
    if (c.badge && /^data:image\//.test(c.badge)) {
      var seal = el("span", "seal");
      var im = document.createElement("img");
      im.src = c.badge; im.alt = c.alt || "Yoga Alliance RYT 200 Registered Yoga Teacher badge";
      seal.appendChild(im);
      box.appendChild(seal);
    }
    var tx = el("span", "ctext");
    tx.appendChild(el("strong", null, c.title));
    tx.appendChild(el("span", null, c.text));
    box.appendChild(tx);
    return box;
  }

  function bulletLi(t) {
    var li = el("li");
    var m = /^\*\*(.+?)\*\*\s*([\s\S]*)$/.exec(t);
    if (m) { li.appendChild(el("strong", null, m[1] + " ")); li.appendChild(document.createTextNode(m[2])); }
    else li.textContent = t;
    return li;
  }

  function companyList(list) {
    var wrap = el("div", "companies");
    (list || []).forEach(function (c) {
      var box = el("div", "company");
      var h = el("h3", "co");
      h.appendChild(document.createTextNode(c.company + ", "));
      h.appendChild(el("span", "co-years", c.years));
      box.appendChild(h);
      if (c.description) box.appendChild(el("p", "codesc", c.description));
      (c.roles || []).forEach(function (r) {
        var rd = el("div", "role");
        rd.appendChild(el("strong", "rt", r.years ? r.title + ", " + r.years : r.title));
        var ul = el("ul", "bul");
        (r.bullets || []).forEach(function (t) { ul.appendChild(bulletLi(t)); });
        rd.appendChild(ul);
        box.appendChild(rd);
      });
      wrap.appendChild(box);
    });
    return wrap;
  }

  function expList(list) {
    var ul = el("ul", "rows exp");
    (list || []).forEach(function (r) {
      var li = el("li");
      li.appendChild(el("div", "when", r.when));
      var w = el("div", "what");
      w.appendChild(el("strong", null, r.title + ", " + r.place));
      if (r.note) w.appendChild(el("span", null, r.note));
      if (r.bullets && r.bullets.length) {
        var b = el("ul", "bul");
        r.bullets.forEach(function (t) { b.appendChild(bulletLi(t)); });
        w.appendChild(b);
      }
      li.appendChild(w);
      ul.appendChild(li);
    });
    return ul;
  }

  var RENDERERS = {
    recruiters: function (root, D) {
      var about = section("About"); about.appendChild(paragraphs(D.about)); root.appendChild(about);

      var im = section(D.impactTitle);
      var stats = el("div", "stats");
      (D.impact || []).forEach(function (i) {
        var c = el("div", "stat");
        c.appendChild(el("strong", null, i.value));
        c.appendChild(el("span", null, i.label));
        stats.appendChild(c);
      });
      im.appendChild(stats); root.appendChild(im);

      var ex = section(D.experienceTitle); ex.appendChild(expList(D.experience)); root.appendChild(ex);
      var vt = section(D.venturesTitle); vt.appendChild(expList(D.ventures)); root.appendChild(vt);

      var st = section(D.strengthsTitle); st.appendChild(chips(D.strengths)); root.appendChild(st);
      var tl = section(D.toolsTitle); tl.appendChild(chips(D.tools)); root.appendChild(tl);
      var ed = section(D.educationTitle); ed.appendChild(rows(D.education, "label", null, "text")); root.appendChild(ed);
      var how = section(D.howTitle); how.appendChild(rows(D.how, "label", null, "text")); root.appendChild(how);
      root.appendChild(contactBlock(D));
    },
    clients: function (root, D) {
      var about = section("About"); about.appendChild(paragraphs(D.about));
      if (D.credential) about.appendChild(credentialCard(D.credential));
      root.appendChild(about);
      var h = section(D.helpTitle); h.appendChild(chips(D.help)); root.appendChild(h);
      var o = section(D.offersTitle); o.appendChild(cards(D.offers)); root.appendChild(o);
      if (D.bioTitle) {
        var bs = section(D.bioTitle);
        bs.appendChild(paragraphs(D.bio));
        if (D.bioLink && safeUrl(D.bioLink.href)) {
          var lp = el("p"); var la = el("a", null, D.bioLink.label);
          la.href = D.bioLink.href; la.target = "_blank"; la.rel = "noopener noreferrer";
          lp.appendChild(la); bs.appendChild(lp);
        }
        root.appendChild(bs);
      }
      if (D.storyTitle) {
        var sy = section(D.storyTitle);
        sy.appendChild(paragraphs(D.story));
        sy.appendChild(gallery(D.photos));
        root.appendChild(sy);
      }
      var p = section(D.processTitle); p.appendChild(rows(D.process, "label", null, "text")); root.appendChild(p);
      root.appendChild(contactBlock(D));
    },
    personal: function (root, D) {
      var about = section("A bit about me"); about.appendChild(paragraphs(D.about)); root.appendChild(about);
      var l = section(D.lovesTitle); l.appendChild(chips(D.loves)); root.appendChild(l);
      var la = section(D.latelyTitle); la.appendChild(rows(D.lately, "label", null, "text")); root.appendChild(la);
      if (!D.noContact) root.appendChild(contactBlock(D));
    }
  };

  function renderSwitch() {
    var wrap = $("switch");
    wrap.textContent = "";
    VIEWS.forEach(function (v) {
      var b = el("button", null, v.label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(v.key === mode));
      b.addEventListener("click", function () { setMode(v.key, true); });
      wrap.appendChild(b);
    });
  }

  function renderCover() {
    var C = SITE.cover, L = SITE.links;
    $("brand").textContent = SITE.name;
    $("cover-eyebrow").textContent = C.eyebrow || "";
    $("cover-tag").textContent = C.tagline;
    $("explore-eyebrow").textContent = C.exploreEyebrow || "";
    $("explore-title").textContent = C.exploreTitle || "";

    var facts = $("cover-facts"); facts.textContent = "";
    (C.facts || []).forEach(function (t) { facts.appendChild(el("li", null, t)); });

    var nav = $("topnav"); nav.textContent = "";
    VIEWS.forEach(function (v) {
      var b = el("button"); b.type = "button";
      b.appendChild(el("span", "dot dot-" + v.key));
      b.appendChild(document.createTextNode(v.label));
      b.addEventListener("click", function () { setMode(v.key, true); });
      nav.appendChild(b);
    });

    var top = $("top-cta"); top.textContent = "";
    var which = C.topButton || "linkedin";
    var tu = safeUrl(L[which]);
    if (tu) {
      var ta = el("a", null, which === "instagram" ? "Instagram" : "LinkedIn");
      ta.href = tu; ta.target = "_blank"; ta.rel = "noopener noreferrer";
      top.appendChild(ta);
    }

    var cta = $("cover-cta"); cta.textContent = "";
    if (C.primary) {
      var b1 = el("button", "btn", C.primary.label + " \u2192"); b1.type = "button";
      b1.addEventListener("click", function () { setMode(C.primary.view, true); });
      cta.appendChild(b1);
    }
    if (C.secondary) {
      var b2 = el("button", "link-btn", C.secondary.label + " \u2192"); b2.type = "button";
      b2.addEventListener("click", function () { setMode(C.secondary.view, true); });
      cta.appendChild(b2);
    }

    var grid = $("tabs"); grid.textContent = "";
    VIEWS.forEach(function (v, i) {
      var c = el("button", "xcard x-" + v.key); c.type = "button";
      c.appendChild(el("span", "xnum", "0" + (i + 1)));
      c.appendChild(el("strong", null, v.label));
      c.appendChild(el("span", "xd", (C.tabDescriptions || {})[v.key] || ""));
      var tags = el("span", "xtags");
      ((C.tabTags || {})[v.key] || []).forEach(function (t) { tags.appendChild(el("span", null, t)); });
      c.appendChild(tags);
      c.appendChild(el("span", "xgo", "Open \u2192"));
      c.addEventListener("click", function () { setMode(v.key, true); });
      grid.appendChild(c);
    });

    var f = $("cover-foot"); f.textContent = "";
    var fl = el("span", "fl");
    [["linkedin", "LinkedIn"], ["instagram", "Instagram"]].forEach(function (d) {
      var u = safeUrl(L[d[0]]);
      if (!u) return;
      var a = el("a", null, d[1]); a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
      fl.appendChild(a);
    });
    f.appendChild(fl);
    f.appendChild(el("span", null, "\u00a9 " + new Date().getFullYear() + " " + SITE.name + (SITE.alsoKnownAs ? " (" + SITE.alsoKnownAs + ")" : "")));
  }

  function render() {
    document.documentElement.setAttribute("data-mode", mode);
    try {
      var bgc = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      if (bgc) document.querySelector('meta[name="theme-color"]').setAttribute("content", bgc);
    } catch (e) {}
    var isCover = mode === "cover";
    $("cover").hidden = !isCover;
    $("page").hidden = isCover;
    try { window.scrollTo(0, 0); } catch (e) {}
    if (isCover) { renderCover(); return; }
    var D = SITE[mode];
    $("tagline").textContent = D.tagline;
    renderSwitch();
    renderLinks(D.lead, null, D.email, D.show);
    var root = $("content");
    root.textContent = "";
    RENDERERS[mode](root, D);
  }

  function setMode(m, updateUrl) {
    mode = m;
    render();
    if (updateUrl) { try { history.replaceState(null, "", "#" + (m === "cover" ? "home" : m)); } catch (e) {} }
  }

  // Turns the photo into a round browser-tab icon
  function setPhotoFavicon(src) {
    var im = new Image();
    im.onload = function () {
      var c = document.createElement("canvas");
      c.width = c.height = 64;
      var x = c.getContext("2d");
      x.beginPath(); x.arc(32, 32, 32, 0, Math.PI * 2); x.closePath(); x.clip();
      var s = Math.min(im.width, im.height) * 0.9;   // zoom in a little so the face reads at tiny size
      x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 64, 64);
      var l = document.getElementById("favicon");
      l.type = "image/png";
      l.href = c.toDataURL("image/png");
    };
    im.src = src;
  }

  // Static parts
  // Puts the first name on one line and the rest on the next
  function stackName(node, full) {
    var words = full.trim().split(/\s+/);
    node.textContent = "";
    node.appendChild(document.createTextNode(words[0] + " "));
    if (words.length > 1) {
      node.appendChild(document.createElement("br"));
      var hl = document.createElement("span");
      hl.className = "hl";
      hl.textContent = words.slice(1).join(" ");
      node.appendChild(hl);
    }
  }
  stackName($("name"), SITE.name);
  stackName($("cover-name"), SITE.name);
  $("where").textContent = SITE.location || "";
  var hasPhoto = SITE.photo && /^data:image\//.test(SITE.photo);
  [$("avatar"), $("cover-photo")].forEach(function (box) {
    if (hasPhoto) {
      var im = document.createElement("img");
      im.src = SITE.photo; im.alt = "";
      box.appendChild(im);
    } else {
      box.textContent = initials(SITE.name);
    }
  });
  if (hasPhoto) setPhotoFavicon(SITE.photo);
  $("footer").textContent = "© " + new Date().getFullYear() + " " + SITE.name + (SITE.alsoKnownAs ? " (" + SITE.alsoKnownAs + ")" : "");

  $("back").addEventListener("click", function () { setMode("cover", true); });
  window.addEventListener("hashchange", function () {
    var m = readModeFromUrl();
    if (m && m !== mode) setMode(m, false);
  });

  mode = readModeFromUrl() || "cover";
  render();
})();
</script>
